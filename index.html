<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Carregando...</title>

  <script src="links.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const produto = params.get("p");

    let link = links[produto] || "https://SEU_LINK_PADRAO";

    setTimeout(function(){
      window.location.href = link;
    }, 5000);
  </script>

</head>
<body style="text-align:center; font-family: Arial;">
  <h2>🔴 Aguarde... liberando conteúdo</h2>
  <p>Preparando seu acesso...</p>

  <p>Se não redirecionar, <a id="manualLink" href="#">clique aqui</a></p>

  <script>
    document.getElementById("manualLink").href = link;
  </script>

</body>
</html>
