<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Carregando...</title>

  <script>
    const params = new URLSearchParams(window.location.search);
    const produto = params.get("produto");

    let link = "";

    if(produto == "1"){
      link = "SEU_LINK_PRODUTO_1";
    } 
    else if(produto == "2"){
      link = "SEU_LINK_PRODUTO_2";
    } 
    else if(produto == "3"){
      link = "SEU_LINK_PRODUTO_3";
    } 
    else {
      link = "SEU_LINK_PADRAO";
    }

    setTimeout(function(){
      window.location.href = link;
    }, 5000);
  </script>

</head>
<body style="text-align:center; font-family: Arial;">
  <h2>🔴 Aguarde... liberando conteúdo</h2>
  <p>Você será redirecionado em alguns segundos...</p>
</body>
</html>
